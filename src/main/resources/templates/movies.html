<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('CineRental - Movies')}"></head>
<body>
<div class="bg-animation"></div>
<div class="app-layout">
    <div th:replace="~{fragments/layout :: sidebar('movies')}"></div>
    <main class="main-content">
        <div class="page-header">
            <div><h1>🎬 Movies</h1><p>Browse and search the movie catalog</p></div>
        </div>

        <!-- Search -->
        <form th:action="@{/movies}" method="get" class="search-bar">
            <select name="searchType" class="form-control">
                <option value="title" th:selected="${searchType == 'title'}">By Title</option>
                <option value="actor" th:selected="${searchType == 'actor'}">By Actor</option>
                <option value="category" th:selected="${searchType == 'category'}">By Category</option>
            </select>
            <input type="text" name="search" class="form-control" placeholder="Search movies..."
                   th:value="${search}"/>
            <button type="submit" class="btn btn-primary">🔍 Search</button>
            <a href="/movies" class="btn btn-secondary">Clear</a>
        </form>

        <!-- Movies Table -->
        <div class="card">
            <div class="table-container">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>ID</th><th>Title</th><th>Year</th><th>Language</th>
                        <th>Rating</th><th>Length</th><th>Rental Rate</th><th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${moviesPage != null && moviesPage['content'] != null}"
                        th:each="movie : ${moviesPage['content']}">
                        <td th:text="${movie['filmId']}">1</td>
                        <td style="color:var(--text-primary);font-weight:600" th:text="${movie['title']}">Title</td>
                        <td th:text="${movie['releaseYear']}">2006</td>
                        <td th:text="${movie['language']}">English</td>
                        <td><span class="badge badge-info" th:text="${movie['rating']}">PG</span></td>
                        <td th:text="${movie['length']} + ' min'">90 min</td>
                        <td style="color:var(--success);font-weight:600" th:text="'$' + ${movie['rentalRate']}">$0.99</td>
                        <td><a th:href="@{'/movies/' + ${movie['filmId']}}" class="btn btn-sm btn-outline">View Details</a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${moviesPage == null || moviesPage['content'] == null || moviesPage['content'].isEmpty()}" class="empty-state">
                <div class="icon">🎬</div><p>No movies found.</p>
            </div>
        </div>

        <!-- Pagination (max 9 pages visible + Prev/Next) -->
        <div th:if="${moviesPage != null && moviesPage['totalPages'] != null && moviesPage['totalPages'] > 1}" class="pagination">
            <a class="page-link" th:classappend="${currentPage == 0} ? 'disabled'"
               th:href="@{/movies(page=${currentPage - 1}, size=10, search=${search}, searchType=${searchType})}">← Prev</a>

            <th:block th:with="totalPages=${moviesPage['totalPages']},
                               startPage=${currentPage - 4 < 0 ? 0 : (currentPage + 4 >= totalPages ? (totalPages - 9 < 0 ? 0 : totalPages - 9) : currentPage - 4)},
                               endPage=${startPage + 8 >= totalPages ? totalPages - 1 : startPage + 8}">
                <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
                    <a class="page-link" th:classappend="${i == currentPage} ? 'active'"
                       th:href="@{/movies(page=${i}, size=10, search=${search}, searchType=${searchType})}"
                       th:text="${i + 1}">1</a>
                </th:block>
            </th:block>

            <a class="page-link" th:classappend="${currentPage == moviesPage['totalPages'] - 1} ? 'disabled'"
               th:href="@{/movies(page=${currentPage + 1}, size=10, search=${search}, searchType=${searchType})}">Next →</a>
        </div>
    </main>
</div>
</body>
</html>
