<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Sidebar Fragment -->
<div th:fragment="sidebar(activePage)" class="sidebar">
    <div class="sidebar-header">
        <h2>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M7 2v20"/><path d="M2 12h5"/></svg>
            CineManage
        </h2>
        <div class="user-info">
            <div class="username" th:text="${username}">User</div>
            <span class="role-badge role-staff">Staff</span>
        </div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section">
            <div class="nav-section-title">Main Menu</div>
            <a href="/dashboard" class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                </span> Dashboard
            </a>
            <a href="/movies" class="nav-link" th:classappend="${activePage == 'movies'} ? 'active'">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
                </span> Films
            </a>
            <a href="/actors" class="nav-link" th:classappend="${activePage == 'actors'} ? 'active'">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </span> Actors
            </a>
            <a href="/customers" class="nav-link" th:classappend="${activePage == 'customers'} ? 'active'">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </span> Customers
            </a>
        </div>
        <div class="nav-section">
            <div class="nav-section-title">Operations</div>
            <a href="/inventory" class="nav-link" th:classappend="${activePage == 'inventory'} ? 'active'">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7.425V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7.425"/><path d="M12 2v6"/><path d="M12 12v6"/><rect x="2" y="3" width="20" height="4" rx="1"/></svg>
                </span> Inventory
            </a>
            <a href="/rentals" class="nav-link" th:classappend="${activePage == 'rentals'} ? 'active'">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </span> Rentals
            </a>
            <a href="/staff" class="nav-link" th:classappend="${activePage == 'staff'} ? 'active'">
                <span class="nav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                </span> Staff
            </a>
        </div>
    </nav>
    <div class="sidebar-footer">
        <a href="/logout" class="btn btn-block">Logout</a>
    </div>
</div>

<!-- Head Fragment -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">CineManage</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
</html>
